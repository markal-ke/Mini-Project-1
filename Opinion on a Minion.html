<!doctype html>
<html lang="en">

<template id="minion-template">
  <div class="card col-8" style="width: 18rem; margin: 15px" id="card">
    <br>
    <img src="" class="card-img-top" alt="" img>
    <div class="card-body">
      <h4 class="card-name"></h4>
      <p class="card-description"></p>
      <br>
      <h5>Behaviour</h5>
      <h6 class="card-behaviour"></h6>
      <br>
      <h5>Source</h5>
      <h6 class="card-source"></h6>
    </div>
  </div>
  </div>
</template>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title> Opinion on a Minion Test</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
</head>

<body>
  <h1> Fetch a Minion </h1>
  <img id="Alpha" src="Chocobo.png" alt="Chocobo">



 
  
  <div id="test">
<br>
     <div class="nav">
     
    <input type="text" id="search" placeholder="Fetch your Minion">
  </div>
<br>
  <br>
    <div id="card-list" class="row">



</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module">
  const minions = (
    await fetch('https://ffxivcollect.com/api/minions').then(
      (response) => response.json(),
    )
  ).results;
  console.log(minions);

  minions.forEach((minion) => addCard(minion));
  
  function addLoadingBar() {
    removeCards();
  }

  let prevTimer;
  document.getElementById('search').addEventListener("input", (e) => {
    addLoadingBar();
    
    clearTimeout(prevTimer);
    prevTimer = setTimeout(() => {
      const value = e.target.value.toLowerCase();
      console.log(value);
      const filteredMinions = minions.filter((minion) =>
        minion.name.toLowerCase().includes(value)
      );
      console.log(filteredMinions);

      removeCards();

      filteredMinions.forEach((minion) => addCard(minion));
    }, 1000);
  });

  
  function removeCards() {
    document.getElementById('card-list').replaceChildren('');
    
  }

  function addCard(minion) {
    const template = document.getElementById('minion-template').content.cloneNode(true);
    template.querySelector('.card-img-top').src = minion.image;
    template.querySelector('.card-name').innerText = minion.name;
    template.querySelector('.card-description').innerText = minion.description;
    template.querySelector('.card-behaviour').innerText = minion.behavior.name;
    template.querySelector('.card-source').innerText = minion.sources[0]?.text;
    document.getElementById('card-list').appendChild(template);

  }


</script>

</html>
